# ============================================================
#  Velox - Fabric optimization mod for Minecraft 1.21.11
# ============================================================

# --- Gradle JVM ---
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# --- Mod metadata ---
mod_version=1.0-beta6
maven_group=com.velox
archives_base_name=velox
mod_id=velox
mod_name=Velox
mod_description=Replaces Lithium (game-logic), Sodium (rendering) and Sodium Extra (extra options) with one mod for Minecraft 1.21.11, plus an original frame-rate stabilizer and adaptive culling.
mod_author=BennerRock
mod_license=MIT

# --- Minecraft / Fabric toolchain ---
# 1.21.11 is the LAST obfuscated Minecraft release (26.1 is the first clean one),
# so the build must use a remapping Loom plus a mappings layer.
minecraft_version=1.21.11
# Fabric officially recommended Loom for 1.21.11. Loom is version-independent,
# so a newer Loom (e.g. 1.17-SNAPSHOT) will also work.
# Pinned on purpose. 1.14-SNAPSHOT is a rolling snapshot; on 2025-12-23 it resolved to
# 1.14.10, which is built against Gradle 9.2.0 and refuses to load on Gradle 8.x - every
# 1.14.x published so far needs Gradle 9. A fixed version also keeps the build
# reproducible, which is the whole point of this block.
loom_version=1.14.10
# Fabric Loader: 0.18.1 was current when 1.21.11 shipped; 0.18.4 is the newest 0.18.x.
loader_version=0.18.4
# Minecraft 1.20.5+ requires Java 21.
java_version=21
gradle_version=8.12

# --- Mappings ---
# Mojang official mappings are used by default (Fabric recommends them for
# 1.21.11 because Yarn stops being updated after this version).
# To use Yarn instead, set use_mojmap=false and adjust build.gradle.
use_mojmap=true
yarn_mappings=1.21.11+build.4
